<body><h1>Bahasa: Mengenal Huruf dan Kata</h1><p>Materi belajar Smart Learning</p><div class="note">Hari ini kita belajar huruf vokal dan kata sederhana.</div><ol><li>Huruf vokal adalah A, I, U, E, O.</li><li>Gabungkan huruf menjadi kata.</li><li>Contoh: B + O + L + A = BOLA.</li></ol><h2>Latihan</h2><p>Bacalah kata berikut dengan suara jelas: <strong>BUKU, BOLA, IBU</strong>.</p></body>
